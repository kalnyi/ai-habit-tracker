openapi: 3.0.3
info:
  title: Habit Tracker API
  version: 0.1.0
  description: "CRUD API for user habits (ASDLC PoC)."
servers:
  - url: http://localhost:8080
paths:
  /users/{userId}/habits:
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    post:
      summary: Create a habit
      operationId: createHabit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateHabitRequest'
      responses:
        '201':
          description: Habit created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HabitResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      summary: List all habits
      operationId: listHabits
      responses:
        '200':
          description: List of habits
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HabitResponse'
  /users/{userId}/habits/{habitId}:
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: habitId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Get a habit by ID
      operationId: getHabit
      responses:
        '200':
          description: Habit found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HabitResponse'
        '400':
          description: Invalid ID format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Habit not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      summary: Update a habit
      operationId: updateHabit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateHabitRequest'
      responses:
        '200':
          description: Habit updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HabitResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Habit not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Delete a habit
      operationId: deleteHabit
      responses:
        '204':
          description: Habit deleted successfully
        '400':
          description: Invalid ID format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Habit not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /users/{userId}/habits/{habitId}/completions:
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: habitId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      summary: Record a habit completion
      operationId: recordHabitCompletion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateHabitCompletionRequest'
      responses:
        '201':
          description: Completion recorded successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HabitCompletionResponse'
        '400':
          description: Invalid habitId format, missing or unparseable completedOn, or malformed JSON
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Habit not found or soft-deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: A completion already exists for this habit on the given date
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      summary: List completions for a habit
      operationId: listHabitCompletions
      parameters:
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Filter to completions on or after this date (YYYY-MM-DD)
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Filter to completions on or before this date (YYYY-MM-DD)
      responses:
        '200':
          description: List of completions ordered by completedOn descending
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HabitCompletionResponse'
        '400':
          description: Invalid habitId format or unparseable from/to date
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Habit not found or soft-deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /users/{userId}/habits/insights:
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      summary: Get LLM-generated insights about a user's habit patterns
      operationId: getHabitInsights
      responses:
        '200':
          description: Successful response with analytics and narrative
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsightResponse'
        '500':
          description: Upstream LLM failure or internal error
  /users/{userId}/habits/analysis:
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      summary: Get LLM-generated multi-section behavioural analysis
      operationId: getHabitAnalysis
      responses:
        '200':
          description: Successful response with extended analytics and coaching narrative
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisResponse'
        '500':
          description: Upstream LLM failure or internal error
  /users/{userId}/habits/tips:
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      summary: Get LLM-generated personalised tips with retrieved corpus context
      operationId: getHabitTips
      responses:
        '200':
          description: Successful response with retrieved tips and narrative
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TipsResponse'
        '500':
          description: Upstream LLM, embeddings, or internal error
  /users/{userId}/habits/notes:
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    post:
      summary: Persist a user-authored habit note (embeds and stores)
      operationId: createUserNote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoteRequest'
      responses:
        '201':
          description: Note persisted with embedding
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserNote'
        '400':
          description: Malformed request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Upstream embeddings or DB failure
  /users/{userId}/habits/completions/batch:
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    post:
      summary: Record multiple habit completions in one request (partial success)
      operationId: recordHabitCompletionsBatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/BatchCompletionItem'
      responses:
        '200':
          description: Inserted and skipped lists; HTTP 200 even when all skipped
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchCompletionResponse'
        '400':
          description: Malformed request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /users/{userId}/habits/{habitId}/completions/{completionId}:
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: habitId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: completionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      summary: Delete a habit completion
      operationId: deleteHabitCompletion
      responses:
        '204':
          description: Completion deleted successfully
        '400':
          description: Invalid habitId or completionId format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Habit not found, or completion not found, or completion belongs to a different habit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    Frequency:
      type: string
      enum:
        - daily
        - weekly
    CreateHabitRequest:
      type: object
      required:
        - name
        - frequency
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true
        frequency:
          $ref: '#/components/schemas/Frequency'
    UpdateHabitRequest:
      type: object
      required:
        - name
        - frequency
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true
        frequency:
          $ref: '#/components/schemas/Frequency'
    HabitResponse:
      type: object
      required:
        - id
        - name
        - frequency
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        frequency:
          $ref: '#/components/schemas/Frequency'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateHabitCompletionRequest:
      type: object
      required:
        - completedOn
      properties:
        completedOn:
          type: string
          format: date
        note:
          type: string
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true
    HabitCompletionResponse:
      type: object
      required:
        - id
        - habitId
        - completedOn
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        habitId:
          type: string
          format: uuid
        completedOn:
          type: string
          format: date
        note:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true
    HabitContext:
      type: object
      required:
        - userId
        - streaks
        - completionByDay
        - consistencyRanking
        - timeOfDayPatterns
        - correlatedPairs
        - momentumScores
        - retrievedTips
      properties:
        userId:
          type: integer
          format: int64
        streaks:
          type: object
          additionalProperties:
            type: integer
        completionByDay:
          type: object
          additionalProperties:
            type: number
            format: double
        consistencyRanking:
          type: array
          items:
            type: array
            minItems: 2
            maxItems: 2
            items:
              oneOf:
                - type: string
                - type: number
                  format: double
        timeOfDayPatterns:
          type: object
          additionalProperties:
            type: number
            format: double
        correlatedPairs:
          type: array
          items:
            type: array
            minItems: 3
            maxItems: 3
            items:
              oneOf:
                - type: string
                - type: number
                  format: double
        momentumScores:
          type: object
          additionalProperties:
            type: number
            format: double
        retrievedTips:
          type: array
          items:
            type: string
    InsightResponse:
      type: object
      required: [analytics, narrative]
      properties:
        analytics:
          $ref: '#/components/schemas/HabitContext'
        narrative:
          type: string
    AnalysisResponse:
      type: object
      required: [analytics, narrative]
      properties:
        analytics:
          $ref: '#/components/schemas/HabitContext'
        narrative:
          type: string
    ErrorResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
    HabitTip:
      type: object
      required: [id, content]
      properties:
        id:
          type: integer
          format: int64
        content:
          type: string
    RetrievedTip:
      type: object
      required: [tip, similarityScore]
      properties:
        tip:
          $ref: '#/components/schemas/HabitTip'
        similarityScore:
          type: number
          format: double
    NoteRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string
    UserNote:
      type: object
      required: [id, userId, content, createdAt]
      properties:
        id:
          type: integer
          format: int64
        userId:
          type: integer
          format: int64
        content:
          type: string
        createdAt:
          type: string
          format: date-time
    TipsResponse:
      type: object
      required: [externalTips, personalNotes, narrative]
      properties:
        externalTips:
          type: array
          items:
            $ref: '#/components/schemas/RetrievedTip'
        personalNotes:
          type: array
          items:
            $ref: '#/components/schemas/RetrievedTip'
        narrative:
          type: string
    BatchCompletionItem:
      type: object
      required: [habitId, completedOn]
      properties:
        habitId:
          type: string
          format: uuid
        completedOn:
          type: string
          format: date
        note:
          type: string
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true
    SkippedCompletion:
      type: object
      required: [habitId, completedOn, reason]
      properties:
        habitId:
          type: string
          format: uuid
        completedOn:
          type: string
          format: date
        reason:
          type: string
    BatchCompletionResponse:
      type: object
      required: [inserted, skipped]
      properties:
        inserted:
          type: array
          items:
            $ref: '#/components/schemas/HabitCompletionResponse'
        skipped:
          type: array
          items:
            $ref: '#/components/schemas/SkippedCompletion'
